version: 2

# No package manifest to watch: the one sibling (brodisplays) and bronze are
# bro_dependency() pins in CMakeLists.txt, moved deliberately (bro's
# scripts/bump-deps.sh); a ../<name> working tree wins locally. wlroots and the
# other system libraries come from the OS. That leaves the pinned actions in
# .github/workflows/.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [ci]
    commit-message:
      prefix: "ci"
    ignore:
      # GitHub maintains the `v4` major tag and ships security fixes to it, so
      # `@v4` is already patched without any PR. Pinning to an exact patch would
      # trade that automatic patching for a codeql-action PR in every repo on
      # each release. Major bumps (v4 -> v5) still come through.
      - dependency-name: "github/codeql-action"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
